<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t"><title id="t">0.86 precision@1 (portfolio agent, 35 scored queries); 0.93 MRR (same query set); 1.16 s median latency (live agent, streamed over SSE); 14 agent tools (enterprise LangGraph agent, Sikich); 91.4% paper accuracy (transformer + GNN vs 88.2% alone)</title><style>.bx{fill:#161b22;stroke:#30363d}.v{font:700 32px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}.k{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#7aa2f7}.s{font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}.track{fill:#30363d}.bar{fill:#2dd4bf;transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.8,.2,1) forwards}.card{opacity:0;animation:up .7s ease-out forwards}@keyframes grow{to{transform:scaleX(1)}}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){.card{opacity:1}.bar{transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="card" style="animation-delay:0.00s"><rect class="bx" x="1" y="1" width="228" height="148" rx="12"/><text class="v" x="21" y="58">0.86</text><text class="k" x="21" y="84">precision@1</text><text class="s" x="21" y="106">portfolio agent, 35 scored queries</text><rect class="track" x="21" y="122" width="188" height="5" rx="2.5"/><rect class="bar" x="21" y="122" width="162" height="5" rx="2.5" style="animation-delay:0.30s"/></g><g class="card" style="animation-delay:0.15s"><rect class="bx" x="244" y="1" width="228" height="148" rx="12"/><text class="v" x="264" y="58">0.93</text><text class="k" x="264" y="84">MRR</text><text class="s" x="264" y="106">same query set</text><rect class="track" x="264" y="122" width="188" height="5" rx="2.5"/><rect class="bar" x="264" y="122" width="175" height="5" rx="2.5" style="animation-delay:0.45s"/></g><g class="card" style="animation-delay:0.30s"><rect class="bx" x="487" y="1" width="228" height="148" rx="12"/><text class="v" x="507" y="58">1.16 s</text><text class="k" x="507" y="84">median latency</text><text class="s" x="507" y="106">live agent, streamed over SSE</text></g><g class="card" style="animation-delay:0.45s"><rect class="bx" x="730" y="1" width="228" height="148" rx="12"/><text class="v" x="750" y="58">14</text><text class="k" x="750" y="84">agent tools</text><text class="s" x="750" y="106">enterprise LangGraph agent, Sikich</text></g><g class="card" style="animation-delay:0.60s"><rect class="bx" x="973" y="1" width="228" height="148" rx="12"/><text class="v" x="993" y="58">91.4%</text><text class="k" x="993" y="84">paper accuracy</text><text class="s" x="993" y="106">transformer + GNN vs 88.2% alone</text><rect class="track" x="993" y="122" width="188" height="5" rx="2.5"/><rect class="bar" x="993" y="122" width="171" height="5" rx="2.5" style="animation-delay:0.90s"/></g></svg>

name: recently

# Rewrites the "recently" block from real public events.
#
# The previous version of this repository ran a workflow that bumped a
# timestamp every six hours. It produced 297 commits that changed nothing, and
# anyone opening the commit list could see that is all they were. This one runs
# weekly and only commits when the content actually changed.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the block
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The events API no longer carries pull-request titles (they printed as "null"), so read the
          # search API instead: my issues and PRs in other people's repositories, with their state.
          # Closed-unmerged PRs and issues closed as not planned are left out.
          gh api "search/issues?q=author:${{ github.repository_owner }}+is:public+-user:${{ github.repository_owner }}&sort=created&order=desc&per_page=30" \
            --jq '.items[]
                  | select(.pull_request == null or .state == "open" or .pull_request.merged_at != null)
                  | select(.state_reason != "not_planned")
                  | select(.title | test("^(Add|Create|Update|Delete) files? via upload|^Add files via") | not)  # GitHub web-upload default titles
                  | (.repository_url | sub("https://api.github.com/repos/"; "")) as $r
                  | (if .pull_request == null then (if .state == "open" then "issue, open" else "issue, fixed" end)
                     elif .pull_request.merged_at != null then "PR, merged" else "PR, under review" end) as $k
                  | "- [\($r)#\(.number)](\(.html_url)) (\($k)): \(.title)"' \
            | head -n 8 > /tmp/lines.txt || true

          # Fail closed. An empty API response must not blank the section.
          if [ ! -s /tmp/lines.txt ]; then
            echo "no events returned, leaving the existing block alone"
            exit 0
          fi

          python3 - <<'PY'
          import pathlib, re
          block = pathlib.Path("/tmp/lines.txt").read_text().strip()
          readme = pathlib.Path("README.md")
          text = readme.read_text()
          new = re.sub(
              r"<!--START_ACTIVITY-->.*?<!--END_ACTIVITY-->",
              f"<!--START_ACTIVITY-->\n{block}\n<!--END_ACTIVITY-->",
              text,
              flags=re.S,
          )
          if new != text:
              readme.write_text(new)
          PY

      - name: Commit only if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && echo "nothing changed" && exit 0
          git add README.md
          git commit -m "Refresh the recently block"
          git push

name: refresh open-source blocks

# Rewrites the README's OSS table and "recently" feed from live GitHub data (.github/scripts/refresh.py):
# PR/issue state and each repository's star count as plain text, open-source repositories with 1,000+ stars only.
# Weekly, and it commits only when the content actually changed (no timestamp-bump commits).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the generated blocks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/refresh.py
      - name: Commit only if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && echo "nothing changed" && exit 0
          git add README.md
          git commit -m "Refresh open-source status and stars"
          git push
